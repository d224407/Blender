
name: SSHX Runner Debug

on:
  workflow_dispatch:

permissions: {}

jobs:
  debug:
    name: Interactive Runner
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Runner information
        run: |
          echo "=== RUNNER ==="
          uname -a
          cat /etc/os-release
          echo
          echo "=== NETWORK ==="
          curl --version
          git --version
          echo
          echo "=== TIME ==="
          date -u

      - name: Start SSHX session
        run: |
          echo "Starting SSHX..."
          curl -sSf https://sshx.io/get | sh -s run
          